# Talladega Nights: league facts that Fantrax's API may not expose, plus fallbacks.
# Committed on purpose: nothing here is secret. Secrets live in .env.

name: Talladega Nights
teams: 10
format: h2h_points
lineup_lock: weekly            # set before Monday's first NHL game

# Source: Fantrax league settings, verified 2026-09-29 (screenshots). Fantrax only blocks transactions
# that break the total roster size; too many reserves, or an IR violation after 1 lineup period,
# makes a roster illegal; minors aren't enforced.
roster:
  active: {C: 2, LW: 2, RW: 2, D: 4, G: 2}
  reserve: 6
  injured_reserve: 3
  minors: 5                    # career + current regular-season GP <= 165 (skaters and goalies)
  max_players: 28              # Fantrax's total cap (the rules text says 27; Fantrax is authoritative)
  ir_counts_toward_max: true
  minors_count_toward_max: true
  effective_max: 26            # 12 + 6 + 3 + 5: the slot caps bind before 28. Open spots = this - rostered.

keepers:
  regular: 10
  minors: 5
  minors_gp_threshold: 165     # career + current regular-season GP <= 165 (Fantrax setting)
  minors_gp_inclusive: true    # so a player with exactly 165 GP is still a minor; keeper clock starts at 166
  max_times_kept: 3            # regular players, excluding franchise-tagged
  franchise_tags: 4
  clock_resets_on_trade: true

# Scoring weights. `hockey sync` reads these from Fantrax getLeagueInfo when it can; these are only
# used if Fantrax doesn't return them. Fill them in from Fantrax > League > Settings > Scoring.
# Groups: skater, goalie, and optional F / D overrides of skater. Keys are Fantrax codes or column
# names (G, A, +/-, PPP, SOG, HIT, BLK, W, GA, SV, SO, ...).
scoring:
  skater: {}
  #   G: 3
  #   A: 2
  #   +/-: 0.5
  #   PPP: 1
  #   SOG: 0.4
  #   HIT: 0.25
  #   BLK: 0.5
  goalie: {}
  #   W: 4
  #   GA: -2
  #   SV: 0.2
  #   SO: 3
  code_aliases: {}             # e.g. {"Hits": hit} for a code this tool doesn't know yet
  ignore_codes: []             # codes to skip entirely (only ones scored at 0)

projection:
  season_weights: [5, 4, 3]    # most recent completed season first
  regression_games: {F: 25, D: 25, G: 20}
  gp_cap: {F: 82, D: 82, G: 65}

# Optional AI layer (hockey/ai/): Claude reads the engine's numbers through read-only tools and adds
# news and judgment. Needs `uv sync --extra ai` and ANTHROPIC_API_KEY in .env. Nothing here is secret.
ai:
  model: claude-opus-5-5       # a cheaper model works too, e.g. claude-sonnet-5-5
  effort: medium               # low / medium / high / xhigh / max: deeper thinking costs more
  max_tokens: 16000
  fallbacks: true              # if the model declines, the API retries on its recommended fallback model
  web_search: true             # news via Anthropic's server-side web search (fantrax.com is always excluded)
  news_domains: [nhl.com, dailyfaceoff.com, sportsnet.ca, tsn.ca, espn.com]
  max_searches: 8              # web searches per request
  news_ttl_hours: 6            # `--ai` reuses stored news flags this long before searching again

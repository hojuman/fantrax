[project]
name = "hockey-assistant"
version = "0.1.0"
description = "Read-only fantasy hockey assistant for a Fantrax NHL league"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "rich>=13.7",
    "typer>=0.12",
    "unidecode>=1.3",
]

[project.scripts]
hockey = "hockey.cli:app"

[project.optional-dependencies]
ai = [
    "anthropic>=1.9.0",
]
web = [
    "fastapi>=0.142.0",
    "jinja2>=3.1.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "anthropic>=1.9.0", # so the AI layer's tests run (they never call the API)
    "fastapi>=0.142.0",
    "jinja2>=3.1.6",
    "pytest>=8.0",
    "pytest-socket>=0.7",
    "ruff>=0.6",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hockey"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests must never touch the network: everything runs off fixtures.
addopts = "--disable-socket --allow-unix-socket"  # unix: the asyncio loop in the web tests

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# E501: `ruff format` owns wrapping (it leaves long strings alone). B008: Typer's idiom.
ignore = ["E501", "B008"]
